[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Treat warnings from internal application code as errors
    error
    # Ignore third-party CPython 3.14 deprecation warnings in site-packages
    ignore::DeprecationWarning:indic_transliteration.*:
    ignore::DeprecationWarning:google.genai.*:
    ignore:codecs.open\(\) is deprecated:DeprecationWarning
    ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning